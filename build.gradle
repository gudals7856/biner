plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.1'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.biner'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}
dependencies {
    // 1. Spring Boot Core & Web (WebFlux 포함)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Flyway (DB 스키마 버전 관리)
    implementation 'org.flywaydb:flyway-core'
    // [수정] Flyway가 PostgreSQL을 지원하도록 의존성 추가
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Mac OS(Apple Silicon)용 Netty DNS Resolver (Netty 경고 해결) - 해당 OS에서만 추가
    if (System.getProperty('os.name').toLowerCase().contains('mac') && System.getProperty('os.arch') == 'aarch64') {
        runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-aarch_64'
    }

    // 2. Database & ORM (PostgreSQL + TimescaleDB 용)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // 3. In-Memory Store (Redis)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 4. Quant & Technical Analysis Library (지표 계산)
    implementation 'org.ta4j:ta4j-core:0.15'

    // 5. Fault Tolerance (안전장치 - Rate Limit, Circuit Breaker)
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    // 6. Utilities
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // 7. Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 엑셀 파일을 읽기 위한 의존성 추가
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
}

tasks.named('test') {
    useJUnitPlatform()
    
    jvmArgs("-XX:+EnableDynamicAgentLoading")
}
