version: '3.8'

services:
  # 1. 시계열 데이터 및 포지션 상태 저장용 DB
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: biner-timescaledb
    environment:
      # 값은 프로젝트 루트의 .env 파일에서 읽습니다. (.env.example 참고)
      POSTGRES_USER: ${DB_USERNAME:-biner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 환경변수가 필요합니다}
      POSTGRES_DB: trading_db
    ports:
      - "127.0.0.1:5432:5432" # 외부 네트워크에 노출하지 않고 로컬에서만 접속
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - biner-network

  # 2. API 호출 빈도 제어 및 임시 상태 관리용 인메모리 DB
  redis:
    image: redis:alpine
    container_name: biner-redis
    ports:
      - "127.0.0.1:6379:6379" # 외부 네트워크에 노출하지 않고 로컬에서만 접속
    restart: unless-stopped
    networks:
      - biner-network

volumes:
  timescale_data:

networks:
  biner-network:
    driver: bridge