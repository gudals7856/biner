# ===================================================================
# Backtest 환경 프로필 (spring.profiles.active=backtest 일 때 활성화)
# 이 파일의 설정은 application.yml의 설정을 덮어씁니다.
# ===================================================================

# --- 로깅 설정 ---
logging:
  level:
    com.biner: DEBUG # 백테스트 시에는 모든 과정을 상세히 보기 위해 DEBUG 레벨로 설정합니다.

# --- 백테스트 실행 정보 ---
backtest:
  symbol: "BTCUSDT"
  timeframe: "1m" # 백테스트할 시간봉
  start-time: "2023-01-01T00:00:00Z"
  end-time: "2023-01-31T23:59:59Z"
