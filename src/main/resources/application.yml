spring:
  profiles:
    active: backtest # 'backtest' 프로필을 활성화합니다. 실시간 운영 시 이 라인을 주석 처리하거나 'live'로 변경하세요.
  application:
    name: biner
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_db
    username: biner
    password: local_password
  jpa:
    hibernate:
      # [중요] Flyway가 DB 스키마를 전적으로 관리하도록, Hibernate의 자동 DDL 생성 기능을 끕니다.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # Flyway 설정 추가
  flyway:
    enabled: true
    baseline-on-migrate: true # DB에 이미 테이블이 있어도 Flyway가 관리하도록 허용

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.biner: INFO # 기본 로그 레벨을 INFO로 설정
    com.biner.backtest: DEBUG # 백테스트 관련 로그는 상세히 보도록 DEBUG로 설정
    com.biner.strategy.engine: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      binanceApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  ratelimiter:
    instances:
      binanceApi:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
  retry:
    instances:
      binanceApi:
        maxRetryAttempts: 3
        waitDuration: 1s

binance:
  api:
    url: https://testnet.binancefuture.com
    key: ${BINANCE_API_KEY:dummy_key_for_local_test}
    secret: ${BINANCE_API_SECRET:dummy_secret_for_local_test}

# --- 백테스트 전용 설정 ---
backtest:
  symbol: "BTCUSDT"
  start-time: "2023-01-01T00:00:00Z"
  end-time: "2023-01-31T23:59:59Z"
