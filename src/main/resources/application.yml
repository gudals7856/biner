spring:
  profiles:
    # active profile은 외부(예: IDE 실행 설정, 커맨드라인 인자)에서 주입합니다.
    # 'local' 프로필을 사용하면 백테스트가 실행됩니다. (아래 group 설정 참고)
    # 아무것도 지정하지 않으면 'main' 또는 'default' 로직이 실행됩니다.
    group:
      local: "backtest"
  application:
    name: biner
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_db
    username: biner
    password: local_password
  jpa:
    hibernate:
      # [중요] Flyway가 DB 스키마를 전적으로 관리하도록, Hibernate의 자동 DDL 생성 기능을 끕니다.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # Flyway 설정 추가
  flyway:
    enabled: true
    baseline-on-migrate: true # DB에 이미 테이블이 있어도 Flyway가 관리하도록 허용

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.biner: DEBUG # 기본 로그 레벨을 INFO로 설정
    com.biner.backtest: DEBUG # 백테스트 관련 로그는 상세히 보도록 DEBUG로 설정
    com.biner.strategy.engine: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      binanceApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  ratelimiter:
    instances:
      binanceApi:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
  retry:
    instances:
      binanceApi:
        maxRetryAttempts: 3
        waitDuration: 1s

binance:
  api:
    url: https://testnet.binancefuture.com
    key: ${BINANCE_API_KEY:dummy_key_for_local_test}
    secret: ${BINANCE_API_SECRET:dummy_secret_for_local_test}

# --- 백테스트 전용 설정 ---
backtest:
  symbol: "BTCUSDT"
  timeframe: "1m" # 백테스트할 시간봉
  start-time: "2023-01-01T00:00:00Z"
  end-time: "2023-01-31T23:59:59Z"