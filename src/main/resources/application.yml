spring:
  application:
    name: biner
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_db
    username: biner
    password: local_password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.biner.market.websocket: INFO 
    com.biner.strategy.engine: INFO

resilience4j:
  circuitbreaker:
    instances:
      binanceApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  ratelimiter:
    instances:
      binanceApi:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
  retry:
    instances:
      binanceApi:
        maxRetryAttempts: 3
        waitDuration: 1s

binance:
  api:
    url: https://testnet.binancefuture.com
    key: ${BINANCE_API_KEY:dummy_key_for_local_test}
    secret: ${BINANCE_API_SECRET:dummy_secret_for_local_test}
